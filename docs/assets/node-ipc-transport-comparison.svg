<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title description">
  <title id="title">node-ipc v12.0.0 versus v13.0.0 transport benchmark</title>
  <desc id="description">Six exact-environment panels from commit 7f53d86bf73e8143bc2f4cb4b6e8e67c5dd8a833. Each transport shows paired v12.0.0 and v13.0.0 medians. Rankings and certification are disabled.</desc>
