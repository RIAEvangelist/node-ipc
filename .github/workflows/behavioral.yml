name: Cross-language behavioral CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  behavioral:
    name: Node 24.18.1 · Rust 1.85.0 · .NET 8 · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      RUSTUP_TOOLCHAIN: 1.85.0

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24.18.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use .NET 8
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 8.0.x

      - name: Use Rust 1.85.0
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Report toolchains
        run: |
          node --version
          rustc --version --verbose
          dotnet --info

      - name: Install exact Node dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run the exact 3x3 matrix and trailing-frame boundaries
        run: npm run test:behavioral

      - name: Verify the checkout stayed clean
        shell: bash
        run: test -z "$(git status --porcelain --untracked-files=all)"
