name: Test and deploy documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Test, validate, and assemble Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      benchmark_manifest_sha256: ${{ steps.stage.outputs.benchmark_manifest_sha256 }}
      benchmark_dashboard_sha256: ${{ steps.stage.outputs.benchmark_dashboard_sha256 }}
      benchmark_chart_sha256: ${{ steps.stage.outputs.benchmark_chart_sha256 }}
      transport_manifest_sha256: ${{ steps.stage.outputs.transport_manifest_sha256 }}
      transport_dashboard_sha256: ${{ steps.stage.outputs.transport_dashboard_sha256 }}
      transport_chart_sha256: ${{ steps.stage.outputs.transport_chart_sha256 }}
    permissions:
      contents: read
      pages: read

    steps:
      - name: Require main as the deployment source
        env:
          SOURCE_REF: ${{ github.ref }}
        run: test "$SOURCE_REF" = refs/heads/main

      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install exact dependencies
        run: npm ci

      - name: Run tests and generate coverage
        run: npm test

      - name: Verify generated test inventory pages
        run: node docs/scripts/generate-test-pages.mjs --check

      - name: Validate documentation routes, links, metadata, and test inventory
        run: node docs/scripts/validate-site.mjs

      - name: Validate tracked benchmark results
        run: node benchmark/validate-results.js

      - name: Validate tracked transport comparison results
        run: node benchmark/validate-transport-results.js

      - name: Build the standard C oracle
        run: node benchmark/oracle/build.js

      - name: Accept the standard C oracle
        run: node benchmark/c-oracle-smoke.js

      - name: Configure canonical Pages target
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false

      - name: Verify canonical Pages target
        env:
          ACTUAL_BASE_URL: ${{ steps.pages.outputs.base_url }}
          EXPECTED_BASE_URL: https://riaevangelist.github.io/node-ipc/
        shell: bash
        run: |
          set -euo pipefail
          actual="${ACTUAL_BASE_URL%/}/"
          if [[ "$actual" != "$EXPECTED_BASE_URL" ]]; then
            echo "Expected Pages base URL '$EXPECTED_BASE_URL', received '$actual'." >&2
            exit 1
          fi

      - name: Stage isolated Pages artifact
        id: stage
        shell: bash
        run: |
          set -euo pipefail

          site_entry="docs/index.html"
          coverage_root="coverage/node"
          benchmark_root="benchmark/results"
          benchmark_schema="benchmark/result-schema.json"
          benchmark_chart="docs/assets/node-ipc-benchmark.svg"
          transport_root="benchmark/transport-results"
          transport_schema="benchmark/transport-result-schema.json"
          transport_chart="docs/assets/node-ipc-transport-comparison.svg"
          header_asset="assets/node-ipc-header.png"
          performance_asset="assets/node-ipc-performance-tiers.png"
          artifact_root="_site"
          expected_inventory="$RUNNER_TEMP/pages-expected-inventory.txt"
          actual_inventory="$RUNNER_TEMP/pages-actual-inventory.txt"

          test -s "$site_entry"
          test -s "$coverage_root/index.html"
          test -s "$coverage_root/coverage-summary.json"
          test -s "$coverage_root/test-results.json"
          test -s docs/data/test-inventory.json
          test -s docs/data/routes.json
          test -s "$benchmark_root/index.json"
          test -s "$benchmark_schema"
          test -s "$benchmark_chart"
          test -s "$transport_root/index.json"
          test -s "$transport_schema"
          test -s "$transport_chart"
          test -s "$header_asset"
          test -s "$performance_asset"
          test ! -e "$artifact_root"
          git ls-files --error-unmatch "$benchmark_root/index.json" >/dev/null
          git ls-files --error-unmatch "$benchmark_schema" >/dev/null
          git ls-files --error-unmatch "$benchmark_chart" >/dev/null
          git ls-files --error-unmatch "$transport_root/index.json" >/dev/null
          git ls-files --error-unmatch "$transport_schema" >/dev/null
          git ls-files --error-unmatch "$transport_chart" >/dev/null
          git ls-files --error-unmatch "$header_asset" >/dev/null
          git ls-files --error-unmatch "$performance_asset" >/dev/null
          git ls-files --error-unmatch docs/data/test-inventory.json >/dev/null
          git ls-files --error-unmatch docs/data/routes.json >/dev/null

          mapfile -t benchmark_files < <(git ls-files -- "$benchmark_root")
          ((${#benchmark_files[@]} > 0))
          for source in "${benchmark_files[@]}"; do
            relative="${source#benchmark/results/}"
            [[ "$relative" != */* && "$relative" == *.json ]]
            test -s "$source"
          done

          mapfile -t transport_files < <(git ls-files -- "$transport_root")
          ((${#transport_files[@]} > 0))
          for source in "${transport_files[@]}"; do
            relative="${source#benchmark/transport-results/}"
            [[ "$relative" != */* && "$relative" == *.json ]]
            test -s "$source"
          done

          mapfile -t page_entries < <(node --input-type=module -e "import {readFileSync} from 'node:fs'; const {routes}=JSON.parse(readFileSync('docs/data/routes.json','utf8')); for (const route of routes) console.log(route === '/' ? 'index.html' : route.slice(1) + 'index.html');")
          ((${#page_entries[@]} >= 45))

          mkdir -p "$artifact_root"
          cp -a docs/. "$artifact_root/"
          rm -f \
            "$artifact_root/assets/node-ipc-header.png" \
            "$artifact_root/assets/node-ipc-performance-tiers.png"
          test ! -e "$artifact_root/assets/node-ipc-header.png"
          test ! -e "$artifact_root/assets/node-ipc-performance-tiers.png"

          mkdir -p "$artifact_root/assets"
          cp "$header_asset" "$artifact_root/assets/node-ipc-header.png"
          cp "$performance_asset" "$artifact_root/assets/node-ipc-performance-tiers.png"

          mkdir -p "$artifact_root/coverage/report"
          cp -a "$coverage_root"/. "$artifact_root/coverage/report/"

          mkdir -p "$artifact_root/data"
          cp "$coverage_root/coverage-summary.json" "$artifact_root/data/coverage-summary.json"
          cp "$coverage_root/test-results.json" "$artifact_root/data/test-results.json"

          mkdir -p "$artifact_root/data/benchmarks"
          for source in "${benchmark_files[@]}"; do
            cp "$source" "$artifact_root/data/benchmarks/"
          done
          cp "$benchmark_schema" "$artifact_root/data/benchmarks/result-schema.json"
          npm run benchmark:dashboard -- --output="$artifact_root/data/benchmarks/dashboard.json"

          mkdir -p "$artifact_root/data/transport-benchmarks"
          for source in "${transport_files[@]}"; do
            cp "$source" "$artifact_root/data/transport-benchmarks/"
          done
          cp "$transport_schema" "$artifact_root/data/transport-benchmarks/result-schema.json"
          node benchmark/transport-dashboard.js --output="$artifact_root/data/transport-benchmarks/dashboard.json"

          for entry in "${page_entries[@]}"; do
            test -s "$artifact_root/$entry"
          done
          test -s "$artifact_root/assets/node-ipc-header.png"
          test -s "$artifact_root/assets/node-ipc-performance-tiers.png"
          cmp -s "$header_asset" "$artifact_root/assets/node-ipc-header.png"
          cmp -s "$performance_asset" "$artifact_root/assets/node-ipc-performance-tiers.png"
          test -s "$artifact_root/coverage/report/index.html"
          test -s "$artifact_root/data/coverage-summary.json"
          test -s "$artifact_root/data/test-results.json"
          test -s "$artifact_root/data/benchmarks/index.json"
          test -s "$artifact_root/data/benchmarks/dashboard.json"
          test -s "$artifact_root/data/benchmarks/result-schema.json"
          test -s "$artifact_root/assets/node-ipc-benchmark.svg"
          cmp -s "$benchmark_schema" "$artifact_root/data/benchmarks/result-schema.json"
          cmp -s "$benchmark_chart" "$artifact_root/assets/node-ipc-benchmark.svg"
          test -s "$artifact_root/data/transport-benchmarks/index.json"
          test -s "$artifact_root/data/transport-benchmarks/dashboard.json"
          test -s "$artifact_root/data/transport-benchmarks/result-schema.json"
          test -s "$artifact_root/assets/node-ipc-transport-comparison.svg"
          cmp -s "$transport_schema" "$artifact_root/data/transport-benchmarks/result-schema.json"
          cmp -s "$transport_chart" "$artifact_root/assets/node-ipc-transport-comparison.svg"

          forbidden_entry="$({
            find "$artifact_root" \
              \( -name .git -o -name .github -o -name local-node-ipc-certs -o -name node_modules -o -name '.codex-*' \) \
              -print -quit
          } || true)"
          if [[ -n "$forbidden_entry" ]]; then
            echo "Forbidden Pages artifact entry: $forbidden_entry" >&2
            exit 1
          fi

          linked_entry="$(find "$artifact_root" -type l -print -quit)"
          if [[ -n "$linked_entry" ]]; then
            echo "Pages artifact must not contain symbolic links: $linked_entry" >&2
            exit 1
          fi

          {
            find docs -type f \
              ! -path 'docs/assets/node-ipc-header.png' \
              ! -path 'docs/assets/node-ipc-performance-tiers.png' \
              -printf '%P\n'
            printf '%s\n' assets/node-ipc-header.png assets/node-ipc-performance-tiers.png
            find "$coverage_root" -type f -printf 'coverage/report/%P\n'
            printf '%s\n' data/coverage-summary.json data/test-results.json
            for source in "${benchmark_files[@]}"; do
              printf 'data/benchmarks/%s\n' "${source#benchmark/results/}"
            done
            printf '%s\n' data/benchmarks/dashboard.json data/benchmarks/result-schema.json
            for source in "${transport_files[@]}"; do
              printf 'data/transport-benchmarks/%s\n' "${source#benchmark/transport-results/}"
            done
            printf '%s\n' data/transport-benchmarks/dashboard.json data/transport-benchmarks/result-schema.json
          } | LC_ALL=C sort -u > "$expected_inventory"
          find "$artifact_root" -type f -printf '%P\n' | LC_ALL=C sort -u > "$actual_inventory"
          diff -u "$expected_inventory" "$actual_inventory"
          printf 'Verified %s files in the isolated Pages artifact.\n' "$(wc -l < "$actual_inventory")"

          node --input-type=module <<'NODE'
          import {createHash} from 'node:crypto';
          import {readFile} from 'node:fs/promises';

          const root = '_site';
          const files = [
              'data/coverage-summary.json',
              'data/test-results.json',
              'data/test-inventory.json',
              'data/routes.json',
              'data/benchmarks/dashboard.json',
              'data/benchmarks/index.json',
              'data/benchmarks/result-schema.json',
              'data/transport-benchmarks/dashboard.json',
              'data/transport-benchmarks/index.json',
              'data/transport-benchmarks/result-schema.json'
          ];

          for (const file of files) {
              JSON.parse(await readFile(`${root}/${file}`, 'utf8'));
          }

          const schema = JSON.parse(await readFile(`${root}/data/benchmarks/result-schema.json`, 'utf8'));
          if (schema.$id !== 'https://riaevangelist.github.io/node-ipc/data/benchmarks/result-schema.json') {
              throw new Error(`Unexpected benchmark schema $id: ${schema.$id}`);
          }

          const manifestBytes = await readFile(`${root}/data/benchmarks/index.json`);
          const manifest = JSON.parse(manifestBytes);
          const dashboard = JSON.parse(await readFile(`${root}/data/benchmarks/dashboard.json`, 'utf8'));
          if (dashboard.schemaVersion !== 1 || dashboard.rankingEligible !== false || dashboard.certification !== false) {
              throw new Error('Benchmark dashboard policy or schema is invalid.');
          }
          if (dashboard.source.manifest !== 'data/benchmarks/index.json'
              || dashboard.source.manifestSha256 !== createHash('sha256').update(manifestBytes).digest('hex')
              || dashboard.source.resultCount !== manifest.results.length
              || dashboard.source.comparisonState !== manifest.comparisonState) {
              throw new Error('Benchmark dashboard is not linked to the staged manifest.');
          }
          const indexed = new Map(manifest.results.map(entry => [`data/benchmarks/${entry.file}`, entry.sha256]));
          for (const environment of dashboard.environments) {
              for (const run of environment.runs) {
                  if (run.rankingEligible !== false || run.certification !== false
                      || indexed.get(run.raw.detail) !== run.raw.sha256) {
                      throw new Error(`${run.id}: dashboard raw-detail linkage is invalid.`);
                  }
              }
          }

          const transportSchema = JSON.parse(await readFile(`${root}/data/transport-benchmarks/result-schema.json`, 'utf8'));
          if (transportSchema.$id !== 'https://riaevangelist.github.io/node-ipc/data/transport-benchmarks/result-schema.json') {
              throw new Error(`Unexpected transport benchmark schema $id: ${transportSchema.$id}`);
          }
          const transportManifestBytes = await readFile(`${root}/data/transport-benchmarks/index.json`);
          const transportManifest = JSON.parse(transportManifestBytes);
          const transportDashboard = JSON.parse(await readFile(`${root}/data/transport-benchmarks/dashboard.json`, 'utf8'));
          if (transportDashboard.schemaVersion !== 1
              || transportDashboard.rankingEligible !== false
              || transportDashboard.certification !== false
              || transportDashboard.source.manifest !== 'data/transport-benchmarks/index.json'
              || transportDashboard.source.manifestSha256 !== createHash('sha256').update(transportManifestBytes).digest('hex')
              || transportDashboard.source.resultCount !== transportManifest.results.length
              || transportDashboard.source.comparisonState !== transportManifest.comparisonState) {
              throw new Error('Transport benchmark dashboard is not linked to the staged manifest.');
          }
          const transportIndexed = new Map(transportManifest.results.map(entry => [`data/transport-benchmarks/${entry.file}`, entry.sha256]));
          for (const environment of transportDashboard.environments) {
              for (const run of environment.runs) {
                  if (run.rankingEligible !== false || run.certification !== false
                      || transportIndexed.get(run.raw.detail) !== run.raw.sha256) {
                      throw new Error(`${run.id}: transport dashboard raw-detail linkage is invalid.`);
                  }
              }
          }

          const inventory = JSON.parse(await readFile(`${root}/data/test-inventory.json`, 'utf8'));
          const routeManifest = JSON.parse(await readFile(`${root}/data/routes.json`, 'utf8'));
          const results = JSON.parse(await readFile(`${root}/data/test-results.json`, 'utf8'));
          if (inventory.total < 140 || inventory.groups.length * 5 !== inventory.total) {
              throw new Error('Test inventory must retain at least 140 cases in exact five-case groups.');
          }
          if (routeManifest.schemaVersion !== 1 || routeManifest.routes.length < 45) {
              throw new Error('Pages route manifest is incomplete or unsupported.');
          }
          if (results.ok !== true || results.failureCount !== 0 || results.total !== inventory.total) {
              throw new Error('Generated test results do not match the passing tracked inventory.');
          }
          const expectedNames = inventory.groups.flatMap(group => group.cases.map(
              name => `[${group.category}] ${group.name} — ${name}`
          ));
          const passedNames = results.passed.map(name => name.replace(/^\d+\) \.expects /u, ''));
          if (JSON.stringify(passedNames) !== JSON.stringify(expectedNames)) {
              throw new Error('Generated test result names differ from the tracked inventory.');
          }
          NODE

          printf 'benchmark_manifest_sha256=%s\n' "$(sha256sum "$artifact_root/data/benchmarks/index.json" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          printf 'benchmark_dashboard_sha256=%s\n' "$(sha256sum "$artifact_root/data/benchmarks/dashboard.json" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          printf 'benchmark_chart_sha256=%s\n' "$(sha256sum "$artifact_root/assets/node-ipc-benchmark.svg" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          printf 'transport_manifest_sha256=%s\n' "$(sha256sum "$artifact_root/data/transport-benchmarks/index.json" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          printf 'transport_dashboard_sha256=%s\n' "$(sha256sum "$artifact_root/data/transport-benchmarks/dashboard.json" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          printf 'transport_chart_sha256=%s\n' "$(sha256sum "$artifact_root/assets/node-ipc-transport-comparison.svg" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages
          path: _site
          retention-days: 1
          include-hidden-files: true

  deploy:
    name: Deploy canonical GitHub Pages site
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          artifact_name: github-pages

      - name: Use Node.js 24 for live acceptance
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Verify the complete live site
        env:
          EXPECTED_BENCHMARK_CHART_SHA256: ${{ needs.build.outputs.benchmark_chart_sha256 }}
          EXPECTED_BENCHMARK_DASHBOARD_SHA256: ${{ needs.build.outputs.benchmark_dashboard_sha256 }}
          EXPECTED_BENCHMARK_MANIFEST_SHA256: ${{ needs.build.outputs.benchmark_manifest_sha256 }}
          EXPECTED_TRANSPORT_CHART_SHA256: ${{ needs.build.outputs.transport_chart_sha256 }}
          EXPECTED_TRANSPORT_DASHBOARD_SHA256: ${{ needs.build.outputs.transport_dashboard_sha256 }}
          EXPECTED_TRANSPORT_MANIFEST_SHA256: ${{ needs.build.outputs.transport_manifest_sha256 }}
          LIVE_BASE_URL: ${{ steps.deployment.outputs.page_url }}
          LIVE_CACHE_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';

          const base = new URL(process.env.LIVE_BASE_URL.endsWith('/')
              ? process.env.LIVE_BASE_URL
              : `${process.env.LIVE_BASE_URL}/`);
          assert.equal(base.href, 'https://riaevangelist.github.io/node-ipc/');

          const wait = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));
          const live = async (path, expectedType) => {
              const url = new URL(path, base);
              url.searchParams.set('pages-run', process.env.LIVE_CACHE_KEY);
              let response;
              let failure;

              for (let attempt = 1; attempt <= 6; attempt += 1) {
                  try {
                      response = await fetch(url, {
                          redirect: 'follow',
                          signal: AbortSignal.timeout(10000)
                      });
                      if (response.status === 200) break;
                      failure = `HTTP ${response.status}`;
                      await response.body?.cancel();
                  } catch (error) {
                      failure = error.message;
                  }
                  if (attempt < 6) await wait(attempt * 1000);
              }

              assert.equal(response?.status, 200, `${url.href}: ${failure ?? 'no response'}`);
              const contentType = response.headers.get('content-type')?.toLowerCase() ?? '';
              assert.match(contentType, expectedType, `${url.href}: unexpected content-type ${contentType}`);
              return response;
          };
          const json = async path => (await live(path, /^application\/json\b/u)).json();

          const routeManifest = await json('data/routes.json');
          assert.equal(routeManifest.schemaVersion, 1);
          assert.ok(Array.isArray(routeManifest.routes));
          assert.ok(routeManifest.routes.length >= 45);
          assert.equal(new Set(routeManifest.routes).size, routeManifest.routes.length);
          const routes = routeManifest.routes.map(route => route === '/' ? '' : route.replace(/^\//u, ''));

          await Promise.all(routes.map(route => live(route, /^text\/html\b/u)));
          await live('coverage/report/', /^text\/html\b/u);
          const inventory = await json('data/test-inventory.json');
          const testResults = await json('data/test-results.json');
          assert.ok(inventory.total >= 140);
          assert.equal(inventory.groups.length * 5, inventory.total);
          assert.equal(testResults.total, inventory.total);
          assert.equal(testResults.failureCount, 0);
          assert.equal(testResults.ok, true);
          const expectedTestNames = inventory.groups.flatMap(group => group.cases.map(
              name => `[${group.category}] ${group.name} — ${name}`
          ));
          assert.deepEqual(
              testResults.passed.map(name => name.replace(/^\d+\) \.expects /u, '')),
              expectedTestNames
          );
          await json('data/coverage-summary.json');

          const manifestResponse = await live('data/benchmarks/index.json', /^application\/json\b/u);
          const manifestBytes = Buffer.from(await manifestResponse.arrayBuffer());
          assert.equal(
              createHash('sha256').update(manifestBytes).digest('hex'),
              process.env.EXPECTED_BENCHMARK_MANIFEST_SHA256,
              'live benchmark manifest differs from the deployed artifact'
          );
          const manifest = JSON.parse(manifestBytes.toString('utf8'));
          assert.ok(Array.isArray(manifest.results), 'benchmark manifest results must be an array');

          const dashboardResponse = await live('data/benchmarks/dashboard.json', /^application\/json\b/u);
          const dashboardBytes = Buffer.from(await dashboardResponse.arrayBuffer());
          assert.equal(
              createHash('sha256').update(dashboardBytes).digest('hex'),
              process.env.EXPECTED_BENCHMARK_DASHBOARD_SHA256,
              'live benchmark dashboard differs from the deployed artifact'
          );
          const dashboard = JSON.parse(dashboardBytes.toString('utf8'));
          assert.equal(dashboard.schemaVersion, 1);
          assert.equal(dashboard.rankingEligible, false);
          assert.equal(dashboard.certification, false);
          assert.equal(dashboard.source.manifest, 'data/benchmarks/index.json');
          assert.equal(dashboard.source.manifestSha256, process.env.EXPECTED_BENCHMARK_MANIFEST_SHA256);
          assert.equal(dashboard.source.resultCount, manifest.results.length);
          assert.equal(dashboard.source.comparisonState, manifest.comparisonState);

          const schema = await json('data/benchmarks/result-schema.json');
          assert.equal(
              schema.$id,
              'https://riaevangelist.github.io/node-ipc/data/benchmarks/result-schema.json'
          );

          for (const entry of manifest.results) {
              assert.match(entry.file ?? '', /^[a-zA-Z0-9._-]+\.json$/u, 'unsafe benchmark detail filename');
              const response = await live(`data/benchmarks/${encodeURIComponent(entry.file)}`, /^application\/json\b/u);
              const bytes = Buffer.from(await response.arrayBuffer());
              assert.equal(
                  createHash('sha256').update(bytes).digest('hex'),
                  entry.sha256,
                  `${entry.file}: manifest SHA-256 mismatch`
              );
              const detail = JSON.parse(bytes.toString('utf8'));
              assert.equal(detail.record?.file, entry.file, `${entry.file}: record.file mismatch`);
          }

          const indexed = new Map(manifest.results.map(entry => [`data/benchmarks/${entry.file}`, entry.sha256]));
          for (const environment of dashboard.environments) {
              for (const run of environment.runs) {
                  assert.equal(run.rankingEligible, false);
                  assert.equal(run.certification, false);
                  assert.equal(indexed.get(run.raw.detail), run.raw.sha256, `${run.id}: raw-detail linkage mismatch`);
              }
          }

          const chartResponse = await live('assets/node-ipc-benchmark.svg', /^image\/svg\+xml\b/u);
          const chartBytes = Buffer.from(await chartResponse.arrayBuffer());
          assert.equal(
              createHash('sha256').update(chartBytes).digest('hex'),
              process.env.EXPECTED_BENCHMARK_CHART_SHA256,
              'live benchmark chart differs from the deployed artifact'
          );

          const transportManifestResponse = await live('data/transport-benchmarks/index.json', /^application\/json\b/u);
          const transportManifestBytes = Buffer.from(await transportManifestResponse.arrayBuffer());
          assert.equal(createHash('sha256').update(transportManifestBytes).digest('hex'), process.env.EXPECTED_TRANSPORT_MANIFEST_SHA256, 'live transport manifest differs from the deployed artifact');
          const transportManifest = JSON.parse(transportManifestBytes.toString('utf8'));
          assert.ok(Array.isArray(transportManifest.results));
          const transportDashboardResponse = await live('data/transport-benchmarks/dashboard.json', /^application\/json\b/u);
          const transportDashboardBytes = Buffer.from(await transportDashboardResponse.arrayBuffer());
          assert.equal(createHash('sha256').update(transportDashboardBytes).digest('hex'), process.env.EXPECTED_TRANSPORT_DASHBOARD_SHA256, 'live transport dashboard differs from the deployed artifact');
          const transportDashboard = JSON.parse(transportDashboardBytes.toString('utf8'));
          assert.equal(transportDashboard.schemaVersion, 1);
          assert.equal(transportDashboard.rankingEligible, false);
          assert.equal(transportDashboard.certification, false);
          assert.equal(transportDashboard.source.manifest, 'data/transport-benchmarks/index.json');
          assert.equal(transportDashboard.source.manifestSha256, process.env.EXPECTED_TRANSPORT_MANIFEST_SHA256);
          assert.equal(transportDashboard.source.resultCount, transportManifest.results.length);
          assert.equal(transportDashboard.source.comparisonState, transportManifest.comparisonState);
          const transportSchema = await json('data/transport-benchmarks/result-schema.json');
          assert.equal(transportSchema.$id, 'https://riaevangelist.github.io/node-ipc/data/transport-benchmarks/result-schema.json');
          for (const entry of transportManifest.results) {
              assert.match(entry.file ?? '', /^run-[A-Za-z0-9-]+[.]json$/u, 'unsafe transport detail filename');
              const response = await live(`data/transport-benchmarks/${encodeURIComponent(entry.file)}`, /^application\/json\b/u);
              const bytes = Buffer.from(await response.arrayBuffer());
              assert.equal(createHash('sha256').update(bytes).digest('hex'), entry.sha256, `${entry.file}: transport manifest SHA-256 mismatch`);
              assert.equal(JSON.parse(bytes.toString('utf8')).record?.file, entry.file);
          }
          const transportIndexed = new Map(transportManifest.results.map(entry => [`data/transport-benchmarks/${entry.file}`, entry.sha256]));
          for (const environment of transportDashboard.environments) {
              for (const run of environment.runs) {
                  assert.equal(run.rankingEligible, false);
                  assert.equal(run.certification, false);
                  assert.equal(transportIndexed.get(run.raw.detail), run.raw.sha256, `${run.id}: transport raw-detail linkage mismatch`);
              }
          }
          const transportChartResponse = await live('assets/node-ipc-transport-comparison.svg', /^image\/svg\+xml\b/u);
          const transportChartBytes = Buffer.from(await transportChartResponse.arrayBuffer());
          assert.equal(createHash('sha256').update(transportChartBytes).digest('hex'), process.env.EXPECTED_TRANSPORT_CHART_SHA256, 'live transport chart differs from the deployed artifact');

          await Promise.all([
              live('assets/node-ipc-header.png', /^image\/png\b/u),
              live('assets/node-ipc-performance-tiers.png', /^image\/png\b/u)
          ]);
          NODE
