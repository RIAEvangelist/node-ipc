name: Record Rust and Node TCP benchmark snapshots

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-node-benchmark-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    name: ${{ matrix.os }} · Node 24.18.1 · Rust 1.85.0
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    env:
      RUSTUP_TOOLCHAIN: 1.85.0
      CARGO_TERM_COLOR: never
      NODE_IPC_RUST_BENCHMARK_NODE_LANE: 24.18.1
      NODE_IPC_RUST_BENCHMARK_OS_LANE: ${{ matrix.os }}

    steps:
      - name: Require main as the measured source
        env:
          SOURCE_REF: ${{ github.ref }}
        run: node -e "if(process.env.SOURCE_REF !== 'refs/heads/main') process.exit(1)"

      - name: Check out the measured commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use exact Node.js 24.18.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1

      - name: Install exact Rust 1.85.0
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Report toolchains
        run: |
          node --version
          rustc --version --verbose
          cargo --version --verbose

      - name: Install exact runtime dependencies
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Record the four-lane million-round-trip comparison
        run: node benchmark/rust/record.js --full "--output-directory=${{ runner.temp }}/node-ipc-rust-snapshot"

      - name: Validate the sanitized result
        run: node benchmark/rust/validate.js --tracked "${{ runner.temp }}/node-ipc-rust-snapshot"

      - name: Upload sanitized result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-node-benchmark-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}-node-24.18.1-rust-1.85.0
          path: ${{ runner.temp }}/node-ipc-rust-snapshot/run-*.json
          if-no-files-found: error
          retention-days: 90
